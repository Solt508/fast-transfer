<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقل الملفات المباشر الفائق</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 1.5rem; color: #38bdf8; }
        .status { margin: 15px 0; padding: 10px; border-radius: 8px; background: #334155; font-size: 0.9rem; }
        input[type="file"] { display: none; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; display: inline-block; margin-top: 10px; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .progress-box { margin-top: 20px; display: none; }
        progress { width: 100%; height: 16px; border-radius: 8px; }
        .link-box { word-break: break-all; background: #0b1120; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>نقل الملفات المباشر (P2P)</h2>
        <div id="status" class="status">جاري التهيئة...</div>
        
        <div id="share-section" style="display: none;">
            <p>أرسل هذا الرابط لصديقك لبدء النقل:</p>
            <div id="room-link" class="link-box"></div>
            <button class="btn" onclick="copyLink()">نسخ الرابط</button>
        </div>

        <div id="transfer-section" style="display: none; margin-top: 20px;">
            <label for="file-input" class="btn" id="file-btn">اختر الفيلم أو الملف</label>
            <input type="file" id="file-input">
        </div>

        <div id="progress-section" class="progress-box">
            <span id="progress-label">جاري النقل: 0%</span>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>
    </div>

    <!-- استدعاء مكتبة Socket.io وكود التحكم -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
